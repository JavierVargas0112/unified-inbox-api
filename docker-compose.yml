# Local stack: `docker compose up --build`, then http://localhost:3000/docs
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: inbox
      POSTGRES_PASSWORD: inbox
      POSTGRES_DB: inbox
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U inbox']
      interval: 2s
      retries: 15

  api:
    build: .
    environment:
      DATABASE_URL: postgres://inbox:inbox@db:5432/inbox
    ports:
      - '3000:3000'
    depends_on:
      db:
        condition: service_healthy
